services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-imperivm}
      MYSQL_USER: ${MYSQL_USER:-imperivm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-imperivm_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-imperivm_root_local}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DB/unidades.sql:/docker-entrypoint-initdb.d/01-unidades.sql:ro
      - ./DB/habilidades.sql:/docker-entrypoint-initdb.d/02-habilidades.sql:ro
      - ./DB/unidades_habilidades.sql:/docker-entrypoint-initdb.d/03-unidades_habilidades.sql:ro
      - ./DB/enfrentamientos.sql:/docker-entrypoint-initdb.d/04-enfrentamientos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: imperivm/backend/Dockerfile
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-imperivm}
      MYSQL_USER: ${MYSQL_USER:-imperivm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-imperivm_local}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: imperivm/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
